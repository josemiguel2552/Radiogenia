<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; background: #080818; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; position: relative; }
.gradient-top { position: absolute; top: 0; left: 0; right: 0; height: 400px; background: linear-gradient(180deg, rgba(99,102,241,0.2), transparent); }
.gradient-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 300px; background: linear-gradient(0deg, rgba(139,92,246,0.15), transparent); }
.content { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; padding: 60px 50px; }
.logo { font-size: 32px; font-weight: 700; color: #fff; text-align: center; }
.logo span { color: #a78bfa; }
.headline { font-size: 56px; font-weight: 800; color: #fff; text-align: center; line-height: 1.15; margin-top: 50px; }
.headline em { font-style: normal; background: linear-gradient(135deg, #818cf8, #e879f9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.anatomy { margin-top: 40px; text-align: center; }
.anatomy img { width: 90%; border-radius: 20px; filter: drop-shadow(0 0 60px rgba(99,102,241,0.3)); }
.features { margin-top: 40px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
.feature { display: flex; align-items: center; gap: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 20px 24px; }
.check { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #a855f7); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; font-size: 18px; font-weight: 700; }
.feature-text { color: #e2e8f0; font-size: 22px; font-weight: 500; line-height: 1.3; }
.cta { margin-top: auto; background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899); color: #fff; font-size: 26px; font-weight: 700; padding: 24px; border-radius: 20px; text-align: center; letter-spacing: 0.5px; box-shadow: 0 8px 30px rgba(139,92,246,0.3); }
.sub { text-align: center; margin-top: 16px; color: #94a3b8; font-size: 18px; }
</style>
</head>
<body>
<div class="gradient-top"></div>
<div class="gradient-bottom"></div>
<div class="content">
  <div class="logo">Radiogen<span>.AI</span></div>
  <div class="headline">Acelera tus informes con <em>IA</em></div>
  <div class="anatomy"><img src="../public/anatomy-loader.png" alt="Anatomy"></div>
  <div class="features">
    <div class="feature"><div class="check">&#10003;</div><div class="feature-text">Clasificación automática TNM, BI-RADS, TI-RADS</div></div>
    <div class="feature"><div class="check">&#10003;</div><div class="feature-text">Recomendaciones: Fleischner, ACR y más</div></div>
    <div class="feature"><div class="check">&#10003;</div><div class="feature-text">Radiogen Bot para consultas clínicas</div></div>
    <div class="feature"><div class="check">&#10003;</div><div class="feature-text">Plantillas personalizadas</div></div>
    <div class="feature"><div class="check">&#10003;</div><div class="feature-text">Dictado de voz inteligente</div></div>
  </div>
  <div class="cta">Suscríbete ahora &rarr;</div>
  <div class="sub">radiogen.ai</div>
</div>
</body>
</html>
